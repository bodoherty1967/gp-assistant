<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigPost Assistant — Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F4F7FA;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    .chat-header {
      background: #F97316;
      color: #fff;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-header-icon {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .chat-header-text h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .chat-header-text p {
      font-size: 0.78rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    .test-badge {
      margin-left: auto;
      background: rgba(0,0,0,0.15);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 88%;
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-bubble {
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .msg.user .msg-bubble {
      background: #F97316;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .msg-bubble {
      background: #F4F7FA;
      color: #232B36;
      border-bottom-left-radius: 4px;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
    }

    .msg.assistant .msg-avatar {
      background: #F97316;
      color: #fff;
    }

    .msg.user .msg-avatar {
      background: #E3E8EF;
      color: #232B36;
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 15px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      background: #69727F;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    .chat-input-area {
      padding: 14px 16px;
      border-top: 1px solid #E3E8EF;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      background: #fff;
    }

    .chat-input {
      flex: 1;
      border: 1.5px solid #E3E8EF;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: none;
      outline: none;
      color: #232B36;
      line-height: 1.5;
      transition: border-color 0.15s;
      max-height: 120px;
    }

    .chat-input:focus {
      border-color: #F97316;
    }

    .send-btn {
      background: #F97316;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
      align-self: flex-end;
    }

    .send-btn:hover { background: #EA6A0D; }
    .send-btn:disabled { background: #E3E8EF; color: #69727F; cursor: default; }

    .welcome {
      text-align: center;
      padding: 30px 20px;
      color: #69727F;
    }

    .welcome h2 {
      font-size: 1.1rem;
      color: #232B36;
      margin-bottom: 8px;
    }

    .welcome p {
      font-size: 0.875rem;
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }

    .suggestion-chip {
      background: #FFF3EA;
      color: #C2570C;
      border: 1px solid #FDCCAA;
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .suggestion-chip:hover {
      background: #FDECDE;
    }

    .error-bubble {
      background: #FEE2E2;
      color: #991B1B;
      border-radius: 14px;
      padding: 11px 15px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-header-icon">💬</div>
      <div class="chat-header-text">
        <h1>GigPost Assistant</h1>
        <p>Ask me anything about using the portal</p>
      </div>
      <span class="test-badge">Test Build</span>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h2>Hi! I'm the GigPost Assistant 👋</h2>
        <p>I can answer questions about how to use the GigPost portal — adding events, managing posts, connecting Facebook, specials, billing, and more.</p>
        <div class="suggestions">
          <button class="suggestion-chip" onclick="sendSuggestion(this)">How do I add an event?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">Why isn't my post going to Instagram?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">How do I cancel my subscription?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">What's the Health Score?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">How do specials work?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">How do I add an entertainer?</button>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <textarea
        class="chat-input"
        id="input"
        placeholder="Ask a question about the GigPost portal..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const history = [];

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function sendSuggestion(btn) {
      document.getElementById('input').value = btn.textContent;
      sendMessage();
    }

    function addMessage(role, text) {
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();

      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `msg ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'assistant' ? 'GP' : 'You';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;

      div.appendChild(avatar);
      div.appendChild(bubble);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return div;
    }

    function addTyping() {
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();

      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.id = 'typing';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = 'GP';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';

      div.appendChild(avatar);
      div.appendChild(bubble);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const btn = document.getElementById('send-btn');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';
      btn.disabled = true;

      addMessage('user', text);
      addTyping();

      history.push({ role: 'user', content: text });

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: history.slice(0, -1) })
        });

        const data = await res.json();
        removeTyping();

        if (data.error) {
          const msgs = document.getElementById('messages');
          const err = document.createElement('div');
          err.className = 'error-bubble';
          err.textContent = 'Error: ' + data.error;
          msgs.appendChild(err);
        } else {
          addMessage('assistant', data.reply);
          history.push({ role: 'assistant', content: data.reply });
        }
      } catch (e) {
        removeTyping();
        const msgs = document.getElementById('messages');
        const err = document.createElement('div');
        err.className = 'error-bubble';
        err.textContent = 'Could not reach the server. Is it running?';
        msgs.appendChild(err);
      }

      btn.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
