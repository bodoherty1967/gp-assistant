<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GigPost KB Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F4F7FA;
    min-height: 100vh;
    color: #1a1a1a;
  }

  /* ── header ── */
  .header {
    background: #DE2A2E;
    color: #fff;
    padding: 0 28px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-logo { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em; }
  .header-logo span { opacity: 0.75; }
  .header-sub { font-size: 0.78rem; opacity: 0.85; }
  .header-stats { font-size: 0.82rem; background: rgba(0,0,0,0.15); padding: 5px 14px; border-radius: 20px; font-weight: 600; }

  /* ── toolbar ── */
  .toolbar {
    background: #fff;
    border-bottom: 1px solid #e3e8ef;
    padding: 12px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    max-width: 360px;
    padding: 8px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.9rem;
    outline: none;
  }
  .search-box:focus { border-color: #DE2A2E; }

  select.filter-select {
    padding: 8px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.88rem;
    background: #fff;
    outline: none;
    cursor: pointer;
  }
  select.filter-select:focus { border-color: #DE2A2E; }

  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: background 0.15s;
  }
  .btn-primary { background: #DE2A2E; color: #fff; }
  .btn-primary:hover { background: #B3242A; }
  .btn-ghost { background: #f1f5f9; color: #374151; }
  .btn-ghost:hover { background: #e2e8f0; }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 5px 12px; font-size: 0.82rem; }

  /* ── main layout ── */
  .main { max-width: 900px; margin: 0 auto; padding: 24px 20px; }

  /* ── add form ── */
  .add-form {
    background: #fff;
    border: 2px dashed #DE2A2E;
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 28px;
    display: none;
  }
  .add-form.open { display: block; }
  .add-form h3 { font-size: 1rem; font-weight: 700; color: #DE2A2E; margin-bottom: 14px; }
  .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .form-row input, .form-row select {
    flex: 1;
    min-width: 160px;
    padding: 9px 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.9rem;
    outline: none;
  }
  .form-row input:focus, .form-row select:focus { border-color: #DE2A2E; }
  .form-full { width: 100%; margin-bottom: 12px; }
  .form-full textarea {
    width: 100%;
    padding: 10px 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
    line-height: 1.55;
    resize: vertical;
    min-height: 80px;
    outline: none;
  }
  .form-full textarea:focus { border-color: #DE2A2E; }
  .form-actions { display: flex; gap: 10px; }

  /* ── category section ── */
  .category-section { margin-bottom: 28px; }
  .category-header {
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #DE2A2E;
    padding: 6px 0 8px;
    border-bottom: 2px solid #DE2A2E;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .category-count { font-size: 0.72rem; color: #9ca3af; font-weight: 600; }

  /* ── QA card ── */
  .qa-card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #e3e8ef;
    padding: 16px 18px;
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .qa-card:hover { border-color: #cbd5e1; }
  .qa-card.has-answer { border-left: 3px solid #22c55e; }
  .qa-card.no-answer { border-left: 3px solid #f59e0b; }

  .qa-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .qa-question {
    flex: 1;
    font-size: 0.95rem;
    font-weight: 700;
    color: #111;
    line-height: 1.4;
  }
  .status-badge {
    flex-shrink: 0;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .status-verified { background: #dcfce7; color: #166534; }
  .status-needs-input { background: #fef3c7; color: #92400e; }
  .status-draft { background: #dbeafe; color: #1e40af; }

  .qa-answer {
    width: 100%;
    padding: 10px 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
    line-height: 1.6;
    resize: vertical;
    min-height: 80px;
    outline: none;
    margin-bottom: 10px;
    color: #1a1a1a;
    transition: border-color 0.15s;
  }
  .qa-answer:focus { border-color: #DE2A2E; box-shadow: 0 0 0 3px rgba(249,115,22,0.1); }
  .qa-answer.empty { background: #fffbeb; border-color: #fcd34d; }

  .img-uploading { font-size: 0.8rem; color: #6b7280; font-style: italic; padding: 4px 0; }
  .img-preview { max-width: 100%; max-height: 180px; border-radius: 8px; margin: 6px 0; border: 1px solid #e3e8ef; display: block; }

  .img-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .img-strip:empty { display: none; }
  .img-thumb-wrap { position: relative; display: inline-block; }
  .img-thumb-wrap img { height: 72px; border-radius: 6px; border: 1px solid #e3e8ef; display: block; cursor: pointer; }
  .img-thumb-remove { position: absolute; top: -6px; right: -6px; background: #DE2A2E; color: white;
    border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; line-height: 18px;
    text-align: center; cursor: pointer; display: none; }
  .img-thumb-wrap:hover .img-thumb-remove { display: block; }
  .link-helper { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .link-input { flex: 1; min-width: 120px; padding: 5px 8px; border: 1px solid #e3e8ef; border-radius: 6px; font-size: 0.78rem; color: #374151; background: #f9fafb; }
  .link-input:focus { outline: none; border-color: #DE2A2E; background: #fff; }
  .link-url { flex: 1.5; }
  .qa-actions { display: flex; gap: 8px; align-items: center; }
  .qa-saved { font-size: 0.8rem; color: #16a34a; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
  .qa-saved.show { opacity: 1; }

  /* ── empty state ── */
  .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
  .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; color: #6b7280; }

  /* ── toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #111;
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 600;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
    z-index: 1000;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: #15803d; }
  .toast.error { background: #dc2626; }

  /* ── hidden ── */
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div>
      <div class="header-logo">Gig<span>Post</span> · KB Editor</div>
      <div class="header-sub">Edit answers here → assistant knows them instantly</div>
    </div>
  </div>
  <div class="header-stats" id="stats">Loading…</div>
</div>

<div class="toolbar">
  <input class="search-box" type="text" id="search" placeholder="Search questions…" oninput="renderAll()">
  <select class="filter-select" id="filterStatus" onchange="renderAll()">
    <option value="">All questions</option>
    <option value="needs-input">Needs answer</option>
    <option value="verified">Answered</option>
  </select>
  <select class="filter-select" id="filterCat" onchange="renderAll()">
    <option value="">All categories</option>
  </select>
  <button class="btn btn-primary" onclick="toggleAddForm()">+ New Question</button>
</div>

<div class="main">

  <!-- Add form -->
  <div class="add-form" id="addForm">
    <h3>Add a New Question</h3>
    <div class="form-row">
      <input type="text" id="newQuestion" placeholder="Question text…" style="flex:2">
      <select id="newCategory">
        <option value="General">General</option>
        <option value="Getting started / account">Getting started / account</option>
        <option value="Connecting Facebook & Instagram">Connecting Facebook &amp; Instagram</option>
        <option value="The entertainment calendar">The entertainment calendar</option>
        <option value="Automatic posting">Automatic posting</option>
        <option value="Entertainer cards">Entertainer cards</option>
        <option value="Reels & video">Reels &amp; video</option>
        <option value="Billing">Billing</option>
        <option value="Troubleshooting">Troubleshooting</option>
        <option value="Feature questions">Feature questions</option>
      </select>
    </div>
    <div class="form-full">
      <textarea id="newAnswer" placeholder="Answer (optional — you can leave blank and fill in later)…" rows="3"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="addQuestion()">Save Question</button>
      <button class="btn btn-ghost" onclick="toggleAddForm()">Cancel</button>
    </div>
  </div>

  <div id="qaList"></div>

</div>

<div class="toast" id="toast"></div>

<script>
  let allQA = [];

  async function loadQA() {
    const res = await fetch('/api/qa');
    allQA = await res.json();
    populateCategoryFilter();
    updateStats();
    renderAll();
  }

  function populateCategoryFilter() {
    const sel = document.getElementById('filterCat');
    const current = sel.value;
    const cats = [...new Set(allQA.map(q => q.category).filter(Boolean))].sort();
    sel.innerHTML = '<option value="">All categories</option>' +
      cats.map(c => `<option value="${esc(c)}"${c===current?' selected':''}>${esc(c)}</option>`).join('');
  }

  function updateStats() {
    const total = allQA.length;
    const answered = allQA.filter(q => q.answer && q.answer.trim()).length;
    document.getElementById('stats').textContent = `${answered} / ${total} questions answered`;
  }

  function renderAll() {
    const search = document.getElementById('search').value.toLowerCase();
    const filterStatus = document.getElementById('filterStatus').value;
    const filterCat = document.getElementById('filterCat').value;

    let filtered = allQA.filter(q => {
      if (search && !q.question.toLowerCase().includes(search) && !(q.answer||'').toLowerCase().includes(search)) return false;
      if (filterStatus === 'needs-input' && q.answer && q.answer.trim()) return false;
      if (filterStatus === 'verified' && (!q.answer || !q.answer.trim())) return false;
      if (filterCat && q.category !== filterCat) return false;
      return true;
    });

    const container = document.getElementById('qaList');

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state"><h3>No questions found</h3><p>Try adjusting your search or filter.</p></div>`;
      return;
    }

    // Group by category
    const groups = {};
    filtered.forEach(q => {
      const cat = q.category || 'General';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(q);
    });

    container.innerHTML = Object.entries(groups).map(([cat, qs]) => `
      <div class="category-section">
        <div class="category-header">
          ${esc(cat)}
          <span class="category-count">${qs.filter(q=>q.answer&&q.answer.trim()).length}/${qs.length} answered</span>
        </div>
        ${qs.map(q => renderCard(q)).join('')}
      </div>
    `).join('');
    // Render image strips for any answers that already contain screenshots
    filtered.forEach(q => renderImgStrip(q.id));
  }

  function renderCard(q) {
    const hasAnswer = q.answer && q.answer.trim();
    const statusClass = hasAnswer ? 'status-verified' : 'status-needs-input';
    const statusLabel = hasAnswer ? '✓ Answered' : '? Needs answer';
    const cardClass = hasAnswer ? 'has-answer' : 'no-answer';
    const areaClass = hasAnswer ? '' : 'empty';

    return `
      <div class="qa-card ${cardClass}" id="card-${q.id}">
        <div class="qa-top">
          <div class="qa-question">${esc(q.question)}</div>
          <span class="status-badge ${statusClass}" id="badge-${q.id}">${statusLabel}</span>
        </div>
        <textarea
          class="qa-answer ${areaClass}"
          id="answer-${q.id}"
          placeholder="Type the answer here…"
          onkeydown="handleKey(event, '${q.id}')"
          oninput="onAnswerInput('${q.id}')"
          onpaste="handleImagePaste(event, '${q.id}')"
        >${esc(q.answer || '')}</textarea>
        <div class="img-strip" id="img-strip-${q.id}"></div>
        <div class="link-helper">
          <input type="text" id="link-label-${q.id}" placeholder="Link label (e.g. Facebook help page)" class="link-input">
          <input type="url"  id="link-url-${q.id}"   placeholder="https://..." class="link-input link-url">
          <button class="btn btn-ghost btn-sm" onclick="insertLink('${q.id}')">+ Insert link</button>
        </div>
        <div class="qa-actions">
          <button class="btn btn-primary btn-sm" onclick="saveAnswer('${q.id}')">Save</button>
          <button class="btn btn-ghost btn-sm" onclick="deleteQuestion('${q.id}')">Delete</button>
          <span class="qa-saved" id="saved-${q.id}">✓ Saved</span>
        </div>
      </div>
    `;
  }

  function insertLink(id) {
    const labelEl = document.getElementById('link-label-' + id);
    const urlEl   = document.getElementById('link-url-'   + id);
    const ta      = document.getElementById('answer-'      + id);
    const label   = labelEl.value.trim();
    const url     = urlEl.value.trim();
    if (!url) { showToast('Enter a URL first', 'error'); return; }
    const text = label || url;
    const md   = `[${text}](${url})`;
    // Insert at cursor position (or append if no selection)
    const pos    = ta.selectionStart ?? ta.value.length;
    const before = ta.value.substring(0, pos);
    const after  = ta.value.substring(pos);
    const sep    = before && !before.endsWith('\n') ? ' ' : '';
    ta.value = before + sep + md + after;
    // Clear helper fields
    labelEl.value = '';
    urlEl.value   = '';
    ta.focus();
    onAnswerInput(id);
  }

  async function uploadImageDataUrl(dataUrl, id) {
    const ta = document.getElementById('answer-' + id);
    const pos = ta.selectionStart ?? ta.value.length;
    const before = ta.value.substring(0, pos);
    const after  = ta.value.substring(pos);
    const sep = before && !before.endsWith('\n') ? '\n' : '';
    ta.value = before + sep + '[Uploading screenshot...]\n' + after;
    try {
      const res = await fetch('/api/upload-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: dataUrl })
      });
      const result = await res.json();
      if (result.ok && result.url) {
        ta.value = ta.value.replace('[Uploading screenshot...]\n', `![screenshot](${result.url})\n`);
        showToast('Screenshot added ✓', 'success');
      } else {
        ta.value = ta.value.replace(sep + '[Uploading screenshot...]\n', '');
        showToast('Upload failed: ' + (result.error || 'unknown error'), 'error');
      }
    } catch (err) {
      ta.value = ta.value.replace(sep + '[Uploading screenshot...]\n', '');
      showToast('Upload failed — ' + err.message, 'error');
    }
    onAnswerInput(id);
  }

  async function handleImagePaste(e, id) {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of Array.from(items)) {
      if (!item.type.startsWith('image/')) continue;
      e.preventDefault();
      const file = item.getAsFile();
      if (!file) continue;
      const dataUrl = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = ev => resolve(ev.target.result);
        reader.readAsDataURL(file);
      });
      await uploadImageDataUrl(dataUrl, id);
      return;
    }
  }

  function renderImgStrip(id) {
    const ta    = document.getElementById('answer-' + id);
    const strip = document.getElementById('img-strip-' + id);
    if (!strip) return;
    const matches = [...ta.value.matchAll(/!\[[^\]]*\]\(([^)]+)\)/g)];
    strip.innerHTML = matches.map(m => {
      const url = m[1];
      const escapedUrl = url.replace(/"/g, '&quot;');
      const escapedMd  = m[0].replace(/"/g, '&quot;');
      return `<span class="img-thumb-wrap">
        <img src="${escapedUrl}" title="Click to open" onclick="window.open('${escapedUrl}','_blank')">
        <button class="img-thumb-remove" title="Remove" onclick="removeImg('${id}','${escapedMd}')">✕</button>
      </span>`;
    }).join('');
  }

  function removeImg(id, md) {
    const ta = document.getElementById('answer-' + id);
    ta.value = ta.value.replace(md, '').replace(/\n{3,}/g, '\n\n').trim();
    onAnswerInput(id);
  }

  function onAnswerInput(id) {
    const ta = document.getElementById('answer-' + id);
    if (ta.value.trim()) {
      ta.classList.remove('empty');
    } else {
      ta.classList.add('empty');
    }
    renderImgStrip(id);
  }

  function handleKey(e, id) {
    // Cmd+Enter or Ctrl+Enter to save
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      saveAnswer(id);
    }
  }

  async function saveAnswer(id) {
    const ta = document.getElementById('answer-' + id);
    const answer = ta.value.trim();

    try {
      const res = await fetch('/api/qa/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answer })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);

      // Update local state
      const idx = allQA.findIndex(q => q.id === id);
      if (idx !== -1) allQA[idx].answer = answer;

      // Update badge + card class
      const badge = document.getElementById('badge-' + id);
      const card = document.getElementById('card-' + id);
      if (answer) {
        badge.textContent = '✓ Answered';
        badge.className = 'status-badge status-verified';
        card.classList.add('has-answer');
        card.classList.remove('no-answer');
      } else {
        badge.textContent = '? Needs answer';
        badge.className = 'status-badge status-needs-input';
        card.classList.add('no-answer');
        card.classList.remove('has-answer');
      }

      // Flash saved indicator
      const savedEl = document.getElementById('saved-' + id);
      savedEl.classList.add('show');
      setTimeout(() => savedEl.classList.remove('show'), 2000);

      updateStats();
    } catch (err) {
      showToast('Error saving — try again', 'error');
    }
  }

  async function deleteQuestion(id) {
    if (!confirm('Delete this question?')) return;
    try {
      const res = await fetch('/api/qa/' + id, { method: 'DELETE' });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      allQA = allQA.filter(q => q.id !== id);
      populateCategoryFilter();
      updateStats();
      renderAll();
      showToast('Question deleted', 'success');
    } catch (err) {
      showToast('Error deleting — try again', 'error');
    }
  }

  function toggleAddForm() {
    const form = document.getElementById('addForm');
    form.classList.toggle('open');
    if (form.classList.contains('open')) {
      document.getElementById('newQuestion').focus();
    }
  }

  async function addQuestion() {
    const question = document.getElementById('newQuestion').value.trim();
    const category = document.getElementById('newCategory').value;
    const answer   = document.getElementById('newAnswer').value.trim();

    if (!question) { showToast('Please enter a question', 'error'); return; }

    try {
      const res = await fetch('/api/qa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, category, answer })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      allQA.push(data.entry);
      document.getElementById('newQuestion').value = '';
      document.getElementById('newAnswer').value = '';
      populateCategoryFilter();
      updateStats();
      renderAll();
      document.getElementById('addForm').classList.remove('open');
      showToast('Question added ✓', 'success');
    } catch (err) {
      showToast('Error adding question', 'error');
    }
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    setTimeout(() => t.className = 'toast', 2500);
  }

  function esc(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadQA();
</script>
</body>
</html>
